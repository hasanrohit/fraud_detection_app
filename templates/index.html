<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 450px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; text-align: center; }
        .ALERT { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .APPROVED { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fraud Detection Portal</h2>
    <form id="fraudForm">
        <div class="form-group"><label>Amount:</label><input type="number" step="any" id="Amount" required></div>
        <div class="form-group"><label>Time:</label><input type="number" step="any" id="Time" required></div>
        <div class="form-group"><label>V1:</label><input type="number" step="any" id="V1" required></div>
        <div class="form-group"><label>V2:</label><input type="number" step="any" id="V2" required></div>
        <div class="form-group"><label>V3:</label><input type="number" step="any" id="V3" required></div>
        <button type="submit">Check Transaction</button>
    </form>

    <div id="result"></div>
</div>

<script>
    document.getElementById('fraudForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const payload = {
            Amount: parseFloat(document.getElementById('Amount').value),
            Time: parseFloat(document.getElementById('Time').value),
            V1: parseFloat(document.getElementById('V1').value),
            V2: parseFloat(document.getElementById('V2').value),
            V3: parseFloat(document.getElementById('V3').value)
        };

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            const resultDiv = document.getElementById('result');

            resultDiv.style.display = 'block';
            resultDiv.className = data.status;
            resultDiv.innerHTML = `
                <h3>Result: ${data.status}</h3>
                <p>Fraud Probability: <strong>${(data.fraud_probability * 100).toFixed(2)}%</strong></p>
            `;
        } catch (error) {
            alert('Error connecting to backend!');
        }
    });
</script>

</body>
</html>
